# Builds the Windows .exe and the two Mac apps. Pushing a tag like v1.2.0 also publishes them as a release.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: Fast-Printer.exe
          - os: macos-latest      # Apple chip (M1 and newer)
            asset: Fast-Printer-Mac-Apple.zip
          - os: macos-15-intel    # older Intel Macs
            asset: Fast-Printer-Mac-Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python "Fast Printer.py" --selftest
      - name: Check APP_VERSION matches the tag (the Mac auto-updater compares them)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: grep -q "APP_VERSION = \"${GITHUB_REF_NAME#v}\"" "Fast Printer.py"

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: |
          python "Fast Printer.py" --write-icon icon.ico
          pyinstaller --onefile --windowed --name "Fast Printer" --icon icon.ico --collect-all tkinterdnd2 "Fast Printer.py"
          Move-Item "dist/Fast Printer.exe" "${{ matrix.asset }}"

      - name: Build Mac app
        if: runner.os == 'macOS'
        run: |
          python "Fast Printer.py" --write-icon icon.png
          pyinstaller --windowed --name "Fast Printer" --icon icon.png --collect-all tkinterdnd2 \
            --osx-bundle-identifier com.fastprinter.app "Fast Printer.py"
          "dist/Fast Printer.app/Contents/MacOS/Fast Printer" --selftest
          ditto -c -k --keepParent "dist/Fast Printer.app" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "Fast Printer ${{ github.ref_name }}" --notes "Downloads for Windows and Mac are below." \
            Fast-Printer.exe Fast-Printer-Mac-Apple.zip Fast-Printer-Mac-Intel.zip
